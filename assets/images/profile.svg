<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#e53835" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#e53835" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <rect width="400" height="500" fill="url(#glowGrad)" />

  <!-- Grid texture -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
  </pattern>
  <rect width="400" height="500" fill="url(#grid)" />

  <!-- Abstract Monogram / Profile Graphic -->
  <circle cx="200" cy="180" r="70" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <circle cx="200" cy="180" r="50" fill="none" stroke="#e53835" stroke-dasharray="4 6" stroke-width="1.5" />
  
  <!-- Silhouette / Monogram AI -->
  <text x="200" y="192" font-family="'Cormorant Garamond', serif" font-size="38" font-style="italic" fill="#ffffff" text-anchor="middle" font-weight="500">AI</text>

  <!-- Shoulders / Base -->
  <path d="M 110 360 C 110 270, 290 270, 290 360 L 290 440 L 110 440 Z" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Corner crosshairs -->
  <path d="M 25 35 L 25 25 L 35 25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
  <path d="M 375 465 L 375 475 L 365 475" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />

  <!-- Tech details -->
  <text x="200" y="390" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9c9ca8" text-anchor="middle" letter-spacing="2">AERON IRASUSTA</text>
  <text x="200" y="415" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#646470" text-anchor="middle" letter-spacing="1.5">BATSTATEU · BS COMPUTER SCIENCE</text>
</svg>
